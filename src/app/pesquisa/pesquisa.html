<section class="max-w-6xl mx-auto px-4 py-8 min-h-[60vh]">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">
    Resultados para: <span class="text-(--green)">"{{ termoPesquisado() }}"</span>
  </h1>

  @if (carregando()) {
    <p class="text-gray-600">Buscando receitas...</p>
  } @else if (receitas().length === 0) {
    <p class="text-gray-600">Nenhuma receita encontrada com esse título.</p>
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      @for (receita of receitas(); track receita.id) {
        <app-card-receita
          [imagemUrl]="receita.photoUrl || 'assets/default-recipe.png'"
          [titulo]="receita.title"
          [descricao]="receita.description || ''"
          [isFavorito]="receita.isFavorito ?? false"
          (verReceitaClick)="verDetalheReceita(receita.id)"
          (favoritoClick)="favoritarReceita(receita.id, $event)" 
        ></app-card-receita>
      }
    </div>
  }
</section>
