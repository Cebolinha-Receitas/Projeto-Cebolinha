<div class="flex justify-center items-center p-4">
    <div class="bg-white rounded-md p-3 shadow-md w-full max-w-md">

        <!-- Cabeçalho -->
        <div class="flex items-center gap-4 m-5">
            <div>
                <!-- Exibe o nome e email dinamicamente -->
                <h1 class="text-3xl font-semibold">{{ usuario()?.name || 'Carregando...' }}</h1>
                <h3 class="text-gray-500">{{ usuario()?.email }}</h3>
            </div>
        </div>

        <!--Botões-->
        <div class="flex flex-col gap-2 m-5">
            <button 
                type="button"
                (click)="onMinhasReceitas()"
                class="flex items-center gap-4 p-3 rounded-lg hover:bg-gray-50 transition-colors w-full text-left"
            >
                <div class="rounded-lg bg-red-500 text-white p-3 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-minus"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/><path d="M9 10h6"/></svg>
                </div>
                <span class="text-xl font-medium text-gray-800">Minhas Receitas</span>
            </button>
        </div>
    </div>
</div>
