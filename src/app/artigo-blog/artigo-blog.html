<div class="flex flex-col px-15 py-5 bg-white rounded-xl max-w-[70%] items-center justify-self-center gap-5 shadow-2xl">
    <div class="flex flex-col items-center justify-content-center text-center">
      <h1 class="text-3xl font-bold text-(--darkgreen)">{{ artigo?.title }}</h1>
      <p class="text-gray-500">{{ artigo?.postData }}</p>
    </div>
    
    <div class="flex flex-col items-center justify-content-center p-4">
      <img class="rounded-xl shadow-xl" [src]="artigo?.img" alt="">
    </div>
    
    <div>
      <p class="whitespace-pre-line text-lg" [innerHTML]="artigo?.text"></p>
  </div>
</div>
