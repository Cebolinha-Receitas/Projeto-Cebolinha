<main class="flex flex-col px-15 py-10 bg-white rounded-xl max-w-[70%] items-center justify-self-center gap-5 shadow-2xl">
    <div *ngIf="carregando" class="text-gray-500 font-semibold">
      Carregando receitas...
    </div>

    <div *ngIf="!carregando && !receita.id" class="text-gray-500 font-semibold">
      Nenhuma receita cadastrada ainda.
    </div>

    <div *ngIf="!carregando && !!receita.id">
      <section class="flex flex-col gap-3">
        <div class="flex flex-col gap-3 justify-items-center items-center">
            <h1 class="text-3xl text-center font-bold text-(--darkgreen)"> {{receita.title}} </h1>
            <p class="lowercase text-2xl text-(--green) font-semibold">{{receita.category}}</p>
            <img class="rounded-xl shadow-xl max-w-[70%]" [src]="receita.photoUrl" alt="">
            <div class="w-full">
              <p class="text-gray-500 text-center">Publicado por {{receita.user.name}} em {{receita.publicationDate}}</p>
            </div>
        </div>

        <span></span>

        <div>
            <h2 class="text-xl text-left font-semibold text-(--red)">Descrição</h2>
            <p class="text-lg">{{receita.description}}</p>
        </div>

        <div>
            <h2 class="text-xl text-left font-semibold text-(--red)">Ingredientes</h2>
            <p class="whitespace-pre text-lg">{{receita.ingredients}}</p>
        </div>

        <div>
            <h2 class="text-xl text-left font-semibold text-(--red)">Passo a Passo</h2>
            <p class="whitespace-pre text-lg">{{receita.steps}}</p>
        </div>
      </section>
  
      <section>
  
      </section>
    </div>
</main>
