<button
  type="button"
  (click)="onVoltar()"
  class="flex items-center justify-center gap-4 text-white bg-(--red) rounded-md w-50 p-3 hover:bg-red-800"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="24"
    height="24"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="lucide lucide-plus preview-icon"
  >
    <path d="M5 12h14" />
    <path d="M12 5v14" />
  </svg>
  Nova Receita
</button>

<main class="flex gap-10 p-5">
  <!-- Coluna do Blog -->
  <section class="flex-1/2 flex flex-col gap-5">
    <h1 class="font-bold text-(--darkgreen) text-2xl">Blog do Cebolinha</h1>

    <div *ngFor="let itemb of blogItems" class="max-w-[85%] flex flex-col p-4 rounded-xl items-center bg-white hover:bg-gray-100">
      <button (click)="verDetalhe(itemb.id)">
        <img class="max-w-[100%] rounded-lg" [src]="itemb.img" [alt]="itemb.title">
        <div class="max-w-[90%] text-left">
          <h1 class="font-bold text-lg text-gray-800">{{ itemb.title }}</h1>
          <p class="font-semibold text-gray-500">{{ itemb.postData }}</p>
        </div>
      </button>
    </div>
  </section>

  <!-- Coluna de Receitas vindas da API -->
  <section class="flex-1/2 flex flex-col gap-5">
    <h1 class="font-bold text-(--darkgreen) text-2xl">Receitas da Comunidade</h1>

    <div *ngIf="carregando" class="text-gray-500 font-semibold">
      Carregando receitas...
    </div>

    <div *ngIf="!carregando && receitas.length === 0" class="text-gray-500 font-semibold">
      Nenhuma receita cadastrada ainda.
    </div>

    <div *ngFor="let itemr of receitas" class="w-full">
      <app-card-receita
        [imagemUrl]="itemr.photoUrl || 'assets/default-recipe.png'"
        [titulo]="itemr.title"
        [descricao]="itemr.description || ''"
        (verReceitaClick)="verDetalheReceita(itemr.id)"
      ></app-card-receita>
    </div>
  </section>
</main>
