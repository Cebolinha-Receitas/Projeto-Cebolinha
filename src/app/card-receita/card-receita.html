<div class="flex flex-col bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition-shadow">
  <!-- Imagem da receita -->
  <div class="relative h-48 w-full">
    <img
      [src]="imagemUrl"
      [alt]="titulo"
      class="w-full h-full object-cover"
    />
    <!-- Botão de Favorito -->
    <button
      type="button"
      (click)="onToggleFavorito()"
      class="absolute top-3 right-3 p-2 bg-white/80 backdrop-blur-sm rounded-full hover:bg-white transition-colors"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        [attr.fill]="isFavorito ? '#ef4444' : 'none'"
        [attr.stroke]="isFavorito ? '#ef4444' : 'currentColor'"
        stroke-width="2"
      >
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      </svg>
    </button>
  </div>

  <!-- Informações do Card -->
  <div class="p-4 flex flex-col gap-2">
    <h2 class="font-bold text-xl text-gray-800">{{ titulo }}</h2>
    <p class="text-sm text-gray-600 line-clamp-2">{{ descricao }}</p>

    <button
      type="button"
      (click)="onVerReceita()"
      class="mt-3 w-full py-2 px-4 bg-(--darkgreen) text-white font-medium rounded-lg hover:opacity-90 transition-opacity"
    >
      Ver Receita
    </button>
  </div>
</div>
