<div class="flex w-full flex-col gap-1.5 mb-4">
  @if (label) {
    <label [for]="id" class="text-sm font-semibold text-gray-700">
      {{ label }}
    </label>
  }

  <input
    [id]="id"
    [type]="type"
    [placeholder]="placeholder"
    [value]="valor"
    [disabled]="desabilitado"
    (input)="aoDigitar($event)"
    (blur)="aoTocar()"
    class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 text-sm text-gray-800 placeholder-gray-400 transition-all focus:border-[#033b06] focus:outline-none focus:ring-1 focus:ring-[#033b06] disabled:cursor-not-allowed disabled:bg-gray-100 disabled:opacity-70"
  />
</div>
