<div class="flex min-h-screen items-center justify-center bg-[#d8e7c5] p-6 font-sans">
  <div class="w-full max-w-3xl rounded-2xl bg-white p-8 shadow-sm">
    
    <!-- Cabeçalho -->
    <div class="mb-6">
      <h1 class="text-3xl font-bold text-[#1f2923]">Dados da Conta</h1>
      <p class="mt-1 text-sm text-gray-500">Veja e edite os dados da conta</p>
    </div>

    <!-- Formulário -->
    <form class="flex flex-col gap-6">
      
      <!-- Secção Superior: Foto + Nome e E-mail -->
      <div class="flex flex-col gap-6 sm:flex-row sm:items-center">
        <!-- Foto de Perfil -->
        <div class="h-28 w-28 shrink-0 overflow-hidden rounded-xl">
          <img 
            src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300" 
            alt="Foto de perfil" 
            class="h-full w-full object-cover"
          />
        </div>

        <!-- Campos Nome e E-mail -->
        <div class="flex flex-1 flex-col gap-4">
          <app-input 
            id="nome" 
            label="Nome" 
            type="text" 
            placeholder="Ana Sousa Silva">
          </app-input>

          <app-input 
            id="email" 
            label="E-mail" 
            type="email" 
            placeholder="ana.sousasilva@gmail.com">
          </app-input>
        </div>
      </div>

      <!-- Divisor -->
      <hr class="border-t border-gray-100" />

      <!-- Secção Inferior: Senha e Confirmar Senha -->
      <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
        <app-input 
          id="senha" 
          label="Senha" 
          type="password" 
          placeholder="ana.sousasilva@gmail.com">
        </app-input>

        <app-input 
          id="confirmarSenha" 
          label="Confirmar Senha" 
          type="password" 
          placeholder="ana.sousasilva@gmail.com">
        </app-input>
      </div>

      <!-- Botões de Ação -->
      <div class="mt-4 flex justify-end gap-4">
        <button 
          type="button"
          class="rounded-xl border-2 border-gray-400/80 bg-white px-8 py-2.5 text-sm font-bold text-gray-600 transition-colors hover:bg-gray-50"
        >
          Voltar
        </button>

        <button 
          type="submit"
          class="rounded-xl bg-[#033b06] px-8 py-2.5 text-sm font-bold text-white transition-colors hover:bg-[#022b04]"
        >
          Cadastrar
        </button>
      </div>

    </form>
  </div>
</div>
